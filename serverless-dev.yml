service: nossasaude-server

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3001
    host: 0.0.0.0
  environment: ${file(./config/dev.json):environment}

provider:
  name: aws
  runtime: nodejs24.x
  stage: dev
  region: us-east-1
  memorySize: 256
  timeout: 30
  environment:
    DB: ${self:custom.environment.DB}
    S3_BUCKET: ${self:custom.environment.S3_BUCKET}
    S3_ENDPOINT: ${self:custom.environment.S3_ENDPOINT}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'

functions:

  # ── Members ──────────────────────────────────────────────────────────────────
  createMember:
    name: ${self:service}-dev-createMember
    handler: src/handlers/members.create
    events:
      - http:
          method: POST
          path: /members

  listMembers:
    name: ${self:service}-dev-listMembers
    handler: src/handlers/members.list
    events:
      - http:
          method: GET
          path: /members

  getMember:
    name: ${self:service}-dev-getMember
    handler: src/handlers/members.getById
    events:
      - http:
          method: GET
          path: /members/{id}

  updateMember:
    name: ${self:service}-dev-updateMember
    handler: src/handlers/members.update
    events:
      - http:
          method: PATCH
          path: /members/{id}

  deleteMember:
    name: ${self:service}-dev-deleteMember
    handler: src/handlers/members.remove
    events:
      - http:
          method: DELETE
          path: /members/{id}

  # ── Consultations ─────────────────────────────────────────────────────────────
  createConsultation:
    name: ${self:service}-dev-createConsultation
    handler: src/handlers/consultations.create
    events:
      - http:
          method: POST
          path: /consultations

  listConsultations:
    name: ${self:service}-dev-listConsultations
    handler: src/handlers/consultations.list
    events:
      - http:
          method: GET
          path: /consultations

  getConsultation:
    name: ${self:service}-dev-getConsultation
    handler: src/handlers/consultations.getById
    events:
      - http:
          method: GET
          path: /consultations/{id}

  updateConsultation:
    name: ${self:service}-dev-updateConsultation
    handler: src/handlers/consultations.update
    events:
      - http:
          method: PATCH
          path: /consultations/{id}

  deleteConsultation:
    name: ${self:service}-dev-deleteConsultation
    handler: src/handlers/consultations.remove
    events:
      - http:
          method: DELETE
          path: /consultations/{id}

  # ── Prescription & Exam Images ────────────────────────────────────────────────
  uploadUrl:
    name: ${self:service}-dev-uploadUrl
    handler: src/handlers/prescriptions.createUploadUrl
    events:
      - http:
          method: POST
          path: /consultations/{id}/upload-url

  listImages:
    name: ${self:service}-dev-listImages
    handler: src/handlers/prescriptions.listImages
    events:
      - http:
          method: GET
          path: /consultations/{id}/images

  # ── Sync ──────────────────────────────────────────────────────────────────────
  sync:
    name: ${self:service}-dev-sync
    handler: src/handlers/sync.pull
    events:
      - http:
          method: GET
          path: /sync
